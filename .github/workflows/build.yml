
name: Build AL WARD APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            python3-pip python3-venv build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev
          mkdir -p project
          unzip -o AL_WARD_GitHub_Build.zip -d project

      - name: Install Python tools
        run: |
          python3 -m pip install --user --upgrade pip setuptools
          python3 -m pip install --user buildozer==1.5.0 cython==0.29.34
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          cython --version
          buildozer --version

      - name: Build Android APK
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/project" -name buildozer.spec -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-WARD-APK
          path: project/**/bin/*.apk
          if-no-files-found: error
