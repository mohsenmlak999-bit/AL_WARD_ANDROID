
name: Build AL WARD APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libffi-dev libssl-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.34

      - name: Extract and configure AL WARD project
        run: |
          test -f AL_WARD_GitHub_Build.zip
          mkdir -p project
          unzip -o AL_WARD_GitHub_Build.zip -d project
          SPEC="$(find project -name buildozer.spec -print -quit)"
          test -n "$SPEC"
          sed -i -E '/^[[:space:]]*p4a\.branch[[:space:]]*=/d' "$SPEC"
          sed -i '/^\[app\]/a p4a.branch = master' "$SPEC"
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"
          echo "Using buildozer spec: $SPEC"
          grep -n 'p4a.branch' "$SPEC"

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AL-WARD-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
