name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Unzip project
        run: |
          unzip -o AL_WARD_GitHub_Build.zip -d src
          find src -maxdepth 3 | head -30
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build
        run: |
          SPEC=$(find src -name buildozer.spec | head -1)
          echo "Using: $SPEC"
          cd "$(dirname "$SPEC")"
          yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: alward-apk
          path: src/**/bin/*.apk
