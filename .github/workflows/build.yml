name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Unzip project
        run: |
          unzip -o AL_WARD_GitHub_Build.zip -d src
          find src -name buildozer.spec
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Build
        run: |
          SPEC=$(find src -name buildozer.spec | head -1)
          cd "$(dirname "$SPEC")"
          sed -i 's/^requirements = .*/requirements = hostpython3==3.10.12,python3==3.10.12,kivy==2.3.0,requests,urllib3,chardet,idna,certifi,charset-normalizer,arabic-reshaper,future,python-bidi==0.4.2,pillow,pyjnius,android,androidstorage4kivy/' buildozer.spec
          sed -i '/^\[app\]/a p4a.branch = v2024.01.21' buildozer.spec
          grep -n "requirements\|p4a" buildozer.spec
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show error
        if: failure()
        run: grep -n -i "error\|failed\|exception" build.log | tail -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: alward-apk
          path: src/**/bin/*.apk
