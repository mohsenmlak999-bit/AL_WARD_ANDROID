name: Build AL WARD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o AL_WARD_GitHub_Build.zip -d project

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv python3-dev \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev liblzma-dev \
            libncurses5-dev libreadline-dev uuid-dev

      - name: Setup Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install buildozer==1.5.0 cython==0.29.34
          .venv/bin/cython --version

      - name: Build Android APK
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cd project
          ../.venv/bin/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-WARD-APK
          path: project/bin/*.apk
          if-no-files-found: error
